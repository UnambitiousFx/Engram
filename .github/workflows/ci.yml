name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore Engram.slnx

      - name: Build
        run: dotnet build Engram.slnx --no-restore --configuration Release

      - name: Test (coverage + TRX)
        run: >
          dotnet test --solution Engram.slnx
          --no-build
          --configuration Release
          --report-trx
          --coverage --coverage-output-format cobertura
          --results-directory ./test-results

      - name: Convert TRX to JUnit (for Codecov test results)
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet tool install --global trx2junit
          trx2junit ./test-results/*.trx --output ./test-results/junit

      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          files: ./test-results/*.cobertura.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          report_type: test_results
          files: ./test-results/junit/*.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  native-aot:
    name: Native AOT Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish Native AOT
        run: >
          dotnet publish examples/BasicUsage/BasicUsage.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained

      - name: Run the AOT binary
        run: |
          AOT_BINARY="examples/BasicUsage/bin/Release/net10.0/linux-x64/publish/UnambitiousFx.Examples.BasicUsage"
          output=$("$AOT_BINARY")
          echo "$output"
          # Fingerprints of the RFC 8785 section 3.2.4 sample and of a typed value: a trimming or AOT regression changes them.
          for expected in \
            2d5e01a318d0f0879ab568c4be289c8b1f64ef8921a53c6277d5e069978baacb \
            2b62d9274a0265e7e1286a38436b99e10b4be03844db5a70504404d128da678d; do
            if ! grep -qxF "$expected" <<< "$output"; then
              echo "✗ The AOT binary did not print $expected"
              exit 1
            fi
          done
          echo "✓ Canonicalization and hashing work under Native AOT"
